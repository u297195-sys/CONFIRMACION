<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Confirmación de datos</title>
  <style>
    body { font-family: Arial; background: #f7f7f7; text-align: center; padding:50px; }
    input, button { padding:10px; font-size:16px; margin:5px; }
    button { background:#4CAF50; color:white; border:none; cursor:pointer; }
    button:hover { background:#45a049; }
    #contenidoDatos { background:white; padding:30px; border-radius:10px; display:inline-block; }
  </style>
</head>
<body>

<div id="login">
  <h2>Introduce tu contraseña</h2>
  <input type="password" id="pwd" placeholder="Contraseña">
  <button onclick="verificar()">Entrar</button>
  <p id="error" style="color:red;"></p>
</div>

<div id="contenidoDatos" style="display:none;">
  <h2 id="saludo"></h2>
  <div id="contenido"></div>
  <label>
    <input type="checkbox" id="check"> Confirmo que he recibido mis datos
  </label><br><br>
  <button onclick="confirmar()">Confirmar</button>
  <p id="mensaje"></p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const api = "https://script.google.com/macros/s/AKfycbz4mNud8dFkONZbn70e-jI_PprgtFxdi9kw3eUuJ4qQ8mOPMZnT3hZee6cdTCrsA6xf/exec"; // <- aquí pones la URL publicada de Apps Script

function verificar() {
  const pwd = document.getElementById("pwd").value;
  fetch(api, {
    method: "POST",
    body: new URLSearchParams({ id, password: pwd })
  })
  .then(res => res.text())
  .then(result => {
    console.log("Respuesta servidor:", result);
    if(result === "OK") {
      document.getElementById("login").style.display = "none";
      document.getElementById("contenidoDatos").style.display = "block";
      cargarDatos();
    } else {
      document.getElementById("error").innerText = "Contraseña incorrecta";
    }
  })
  .catch(err => console.error("Error fetch:", err));
}

function cargarDatos() {
  fetch(api + "?id=" + id)
    .then(res => res.json())
    .then(data => {
      if(data === "ERROR") {
        document.body.innerHTML = "Enlace no válido";
        return;
      }
      document.getElementById("saludo").innerText = "Hola, " + data.nombre;
      document.getElementById("contenido").innerHTML = "<a href='" + data.datos + "' target='_blank'>Abrir documento</a>";
    });
}

function confirmar() {
  fetch(api, {
    method: "POST",
    body: new URLSearchParams({ id })
  })
  .then(() => {
    document.getElementById("mensaje").innerText = "Confirmación registrada";
  });
}
</script>

</body>
</html>
